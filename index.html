<html lang="en"><head><meta charset="utf-8">

<title>Laundry</title>
<style>
:root{--bg:#eef9ff;--card:#fff;--tx:#0b2a3c;--mut:#587a8e;--bd:#d3e8f3;--red:#ef4444;--amb:#f59e0b;--grn:#22c55e;--blu:#3b82f6;--acc:#0284c7;--sh:0 8px 24px rgba(2,100,150,.09);

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--tx);font:16px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(900px 420px at 50% -160px,rgba(14,165,233,.14),transparent),radial-gradient(700px 400px at 100% 100%,rgba(2,132,199,.07),transparent),var(--bg)}
.app{max-width:640px;margin:0 auto;padding:16px 14px 28px;position:relative;z-index:1}
.box{background:var(--card);border:1px solid var(--bd);border-radius:18px;margin-bottom:14px;box-shadow:var(--sh);overflow:hidden}
.box.banner{border:0;background:linear-gradient(135deg,#0284c7 0%,#06b6d4 100%)}
h1{margin:0;padding:22px 16px;text-align:center;font-size:21px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.2)}
nav{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
nav .col{padding:14px;display:flex;flex-direction:column;gap:4px}
nav .col+.col{border-left:1px solid var(--bd);justify-content:center}
nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:10px;font-weight:600;text-transform:uppercase;font-size:13px;letter-spacing:.06em;color:var(--mut);transition:.15s}
nav .col+.col button:hover{background:var(--bg);color:var(--tx)}
nav .col+.col button.on{background:rgba(2,132,199,.12);color:var(--acc)}
.hostel{font:inherit;font-weight:700;font-size:15px;padding:10px 12px;border:1.5px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);width:100%;cursor:pointer}
.hostel:focus,.bar select:focus,.rep input:focus,.rep select:focus{outline:2px solid var(--acc);outline-offset:1px}
nav .sub{display:flex;flex-direction:row;gap:4px;background:var(--bg);padding:4px;border-radius:12px;margin:8px 0 0}
nav .sub button{flex:1;text-align:center;padding:8px 4px}
nav .sub button.on{background:var(--card);color:var(--acc);box-shadow:0 2px 8px rgba(2,100,150,.15)}
.bar{display:flex;gap:10px;justify-content:center;padding:12px;overflow:visible}
.bar select{font:inherit;font-weight:600;font-size:14px;padding:8px 14px;border:1.5px solid var(--bd);border-radius:999px;background:var(--card);color:var(--tx);cursor:pointer}
.head,.row{display:grid;grid-template-columns:72px 1fr;align-items:center;padding:14px 16px;gap:10px}
.head{color:var(--mut);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;border-bottom:1px solid var(--bd);background:var(--bg)}
.row{transition:background .15s}.row:hover{background:rgba(2,132,199,.05)}
.row+.row{border-top:1px solid var(--bd)}
.mid{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:14px;background:rgba(2,132,199,.12);color:var(--acc);font-weight:800;font-size:16px}
.st{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;justify-content:space-between;gap:14px;min-width:160px;border:1.5px solid var(--bd);border-radius:999px;padding:7px 12px 7px 16px;font-weight:700;font-size:14px}
.sw{width:14px;height:14px;border-radius:50%}
.red .pill{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.4)}
.amb .pill{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.5)}
.grn .pill{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.45)}
.red .sw{background:var(--red);box-shadow:0 0 0 0 rgba(239,68,68,.6);animation:pulse 1.8s infinite}
.amb .sw{background:var(--amb);box-shadow:0 0 0 0 rgba(245,158,11,.6);animation:pulse 1.8s infinite}
.grn .sw{background:var(--grn);box-shadow:0 0 8px var(--grn)}
.blu .sw{background:var(--blu);box-shadow:0 0 8px var(--blu)}
.blu .pill{background:rgba(59,130,246,.12);border-color:rgba(59,130,246,.45)}
@keyframes pulse{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.mins{color:var(--mut);font-variant-numeric:tabular-nums;font-weight:600}
.maint{padding:16px;border-left:5px solid var(--red)}
.maint h2{margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.maintList{display:flex;flex-wrap:wrap;gap:8px}
.maintList div{padding:6px 14px;border-radius:999px;background:rgba(239,68,68,.1);font-weight:700}
.rep{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px dashed var(--bd)}
.rep select,.rep input{font:inherit;font-size:14px;padding:9px 12px;border:1.5px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx)}
.rep input{flex:1;min-width:150px}
.rep button{font:inherit;font-weight:700;font-size:14px;padding:9px 16px;border:0;border-radius:12px;background:linear-gradient(135deg,#0284c7,#06b6d4);color:#fff;cursor:pointer;transition:.15s}
.rep button:hover{filter:brightness(1.08)}.rep button:disabled{opacity:.4;cursor:default}
.empty{padding:36px 16px;text-align:center;color:var(--mut)}
.foot{font-size:12px;color:var(--mut);text-align:center;margin-top:8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--grn);margin-right:6px}
.dot.off{background:var(--red)}

</style></head><body><div class="bg" aria-hidden="true"><div class="bubbles"></div><div class="waves"><div class="w1"></div><div class="w2"></div></div></div><div class="app"><div class="main">
<section class="panel" data-name="Laundry"></section>
<section class="panel" data-name="WashWatch" data-all="1" data-hostels="1,3,5,7,9,12,14,16,18,21"></section>
</div>
</div>
<script>
/* ---------- SETTINGS ---------- */
const SENSOR_URL = "";   // real mode: page requests SENSOR_URL + "?hostel=7"
const REPORT_URL = "";   // optional: reports are POSTed here as {hostel,id,note}
const POLL_MS = 5000;
const GREEN_MAX = 10, YELLOW_MAX = 30;   // minutes left: 1-10 green, 11-30 yellow, above = red
/* Sensor JSON for one hostel:
 [{"id":"m1","kind":"washing","minutes":45}, {"id":"d4","kind":"drying","fault":true}, ...]
 minutes = number read from the machine display (0/null = idle); fault:true = out of maintenance
 Only M1-M5 (washing) and D1-D4 (drying) are shown. */

/* ---------- DEMO DATA (shared by both sections, one set per hostel) ---------- */
const SIMS = {};
function makeHostel(){
 const rnd=()=>Math.random()<.4?0:(Math.random()<.5?45:Math.ceil(Math.random()*20));
 const l=[];
 for(let i=1;i<=5;i++)l.push({id:"m"+i,kind:"washing",minutes:rnd()});
 for(let i=1;i<=4;i++)l.push({id:"d"+i,kind:"drying",minutes:rnd()});
 const f=l[Math.floor(Math.random()*l.length)];f.fault=true;delete f.minutes;
 return l;
}
async function readSensors(h){
 if(SENSOR_URL){const r=await fetch(SENSOR_URL+"?hostel="+h);return r.json();}
 if(!SIMS[h])SIMS[h]=makeHostel();
 return JSON.parse(JSON.stringify(SIMS[h]));
}
if(!SENSOR_URL)setInterval(()=>{Object.values(SIMS).forEach(l=>l.forEach(m=>{
 if(m.fault)return;
 if(m.minutes>0)m.minutes--; else if(Math.random()<.15)m.minutes=Math.random()<.5?45:15;}));},2000);

/* ---------- HELPERS ---------- */
const num=id=>parseInt(id.replace(/\D/g,""))||0;
const esc=s=>s.replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
/* Boys' hostels: 1, 5, 9, 14, 18. Girls' hostels: 3, 7, 12, 16, 21. Every hostel has its own names. */
const HOSTEL_NAMES={
 1:["Aarav","Rohan","Kabir","Vikram","Arjun","Dev"],
 5:["Karan","Rahul","Aditya","Siddharth","Nikhil","Varun"],
 9:["Ishaan","Manav","Yash","Harsh","Tushar","Ayaan"],
 14:["Rishi","Pranav","Sameer","Kunal","Neel","Rajat"],
 18:["Mohit","Vivek","Ankit","Tanmay","Jay","Omkar"],
 3:["Priya","Ananya","Meera","Sneha","Isha","Neha"],
 7:["Diya","Kavya","Riya","Pooja","Tanvi","Aditi"],
 12:["Shreya","Nisha","Simran","Anjali","Divya","Kriti"],
 16:["Sanya","Mira","Pallavi","Ritika","Swara","Trisha"],
 21:["Vaidehi","Zoya","Naina","Ira","Aisha","Radhika"]};
function namesView(h,f){   // demo names per hostel: replace with your real list
 const rows=(HOSTEL_NAMES[h]||[]).map((name,i)=>({name,done:((h*3+i*5)%7)<3})).filter(p=>f==="done"?p.done:f==="not"?!p.done:true).map(({name,done})=>{
  return `<div class="row ${done?"grn":"amb"}"><div class="who">${name}</div><div class="st ${done?"grn":"amb"}"><span class="pill">${done?"Done":"Not done"}<span class="sw"></span></span></div></div>`;}).join("");
 return `<div class="box names"><div class="head"><div>Name</div><div>Status</div></div>${rows||'<div class="empty">No names.</div>'}</div>`;
}
function classify(m,rep){
 if(m.fault||rep)return{c:"fault"};
 const t=Number(m.minutes)||0;
 if(t<=0)return{c:"blu",label:"Available",t:0};
 if(t<=GREEN_MAX)return{c:"grn",label:"Almost done",t};
 if(t<=YELLOW_MAX)return{c:"amb",label:"Short cycle",t};
 return{c:"red",label:"Heavy cycle",t};
}

/* ---------- ONE INDEPENDENT SECTION ---------- */
function makePanel(root){
 root.innerHTML=`
<div class="box banner"><svg class="dr" viewBox="0 0 40 52" aria-hidden="true"><path d="M20 3C20 3 5 24 5 34a15 15 0 0 0 30 0C35 24 20 3 20 3Z" fill="rgba(255,255,255,.25)" stroke="#fff" stroke-width="2.5"/><path d="M13 36a8 8 0 0 0 7 8" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg><svg class="wm" viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="4" width="52" height="56" rx="9" fill="rgba(255,255,255,.18)" stroke="#fff" stroke-width="2.5"/><circle cx="14" cy="13" r="2" fill="#fff"/><path d="M22 13h26" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><circle cx="32" cy="38" r="17" fill="rgba(255,255,255,.12)" stroke="#fff" stroke-width="2.5"/><g class="drum"><path d="M18 38c5-6 9 6 14 0s9 6 14 0" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="26" cy="31" r="2.5" fill="#fff"/><circle cx="38" cy="44" r="2" fill="#fff"/></g></svg><h1>${root.dataset.name}</h1></div>
<div class="box"><nav>
<div class="col">${root.dataset.all?`<button data-tab="current">Hostel</button>`:""}<select class="hostel" aria-label="Hostel"></select>
${root.dataset.all?"":`<div class="sub"><button data-kind="washing">Washing</button><button data-kind="drying">Drying</button></div>`}</div>
${root.dataset.all?`<div class="col"><button data-tab="updates">Updates</button><button data-tab="history">Your History</button></div>`:""}
</nav></div>
<div class="box bar">${root.dataset.all?`<select class="nfilter" aria-label="Filter"><option value="all">Filter: All</option><option value="done">Filter: Done</option><option value="not">Filter: Not done</option></select>`:""}<select class="sort" aria-label="Filter"${root.dataset.all?" hidden":""}><option value="all">Filter: All</option><option value="blu">Filter: Available</option><option value="grn">Filter: 0-10 min</option><option value="amb">Filter: 11-30 min</option><option value="red">Filter: 30+ min</option></select></div>
${root.dataset.all?"":`<div class="legend"><span><i style="background:var(--blu)"></i>Available</span><span><i style="background:var(--grn)"></i>0-10 min</span><span><i style="background:var(--amb)"></i>11-30 min</span><span><i style="background:var(--red)"></i>30+ min</span></div>`}
<div class="view"></div>
<div class="box maint"><h2>Out of maintenance</h2><div class="maintList"></div>
<div class="rep"><select class="repSel" aria-label="Machine to report"></select><input class="repNote" maxlength="80" placeholder="What’s wrong? (optional)"><button class="repBtn">Report machine</button></div>
<p class="repMsg mins" style="margin:6px 0 0;font-size:13px"></p></div>
<div class="foot"><span class="dot"></span><span class="src"></span></div>`;
 const q=s=>root.querySelector(s), qa=s=>root.querySelectorAll(s);
 const hostelSel=q(".hostel");
 const HL=root.dataset.hostels?root.dataset.hostels.split(",").map(Number):Array.from({length:21},(_,i)=>i+1);
 HL.forEach(i=>hostelSel.add(new Option("Hostel "+i,i)));
 let data=[],hostel=HL[0],kind="washing",tab="current",lastOpts="";
 const reports={};

 function render(){
  qa("nav button").forEach(b=>b.classList.toggle("on",b.dataset.kind?(tab==="current"&&b.dataset.kind===kind):b.dataset.tab===tab));
  const showList=tab==="current", view=q(".view");
  q(".bar").style.display=showList?"":"none";
  q(".maint").style.display=showList&&!root.dataset.all?"":"none";
  if(!showList){
   const t={updates:"No new updates.",history:"Your past cycles will appear here."}[tab];
   if(tab==="history"){view.innerHTML=`<div class="box names"><div class="head"><div>Date</div><div>Status</div></div>${[["Fri, 16 Oct","Not done"],["Tue, 13 Oct","Done"],["Sat, 10 Oct","Done"],["Wed, 7 Oct","Done"]].map(([d,s])=>`<div class="row ${s==="Done"?"grn":"amb"}"><div class="who">${d}</div><div class="st ${s==="Done"?"grn":"amb"}"><span class="pill">${s}<span class="sw"></span></span></div></div>`).join("")}</div>`;return;}
   view.innerHTML=`<div class="box empty">${t}</div>`;return;}
  const all=!!root.dataset.all;
  if(all){view.innerHTML=namesView(hostel,q(".nfilter").value);return;}
  const shown=m=>(all||m.kind===kind)&&(m.kind==="washing"?/^m[1-5]$/i:/^d[1-4]$/i).test(m.id);
  const list=data.filter(shown).map(m=>({...m,...classify(m,reports[hostel+m.id])}));
  const fv=q(".sort").value;
  const ok=list.filter(m=>m.c!=="fault"&&(fv==="all"||m.c===fv));
  const order={blu:["blu","grn","amb","red"],grn:["grn","amb","red","blu"],amb:["amb","grn","red","blu"],red:["red","amb","grn","blu"]}[q(".sort").value];
  ok.sort(order?(a,b)=>order.indexOf(a.c)-order.indexOf(b.c)||a.t-b.t||num(a.id)-num(b.id):(a,b)=>num(a.id)-num(b.id));
  const bad=list.filter(m=>m.c==="fault").sort((a,b)=>num(a.id)-num(b.id));
  const nAv=list.filter(m=>m.c==="blu").length,nRun=list.filter(m=>["grn","amb","red"].includes(m.c)).length;
  q(".maintList").innerHTML=bad.length?bad.map(m=>{const r=reports[hostel+m.id];
   return `<div>${m.id.toUpperCase()}${r?` <span class="mins" style="font-weight:400">· reported${r.note?": "+esc(r.note):""}</span>`:""}</div>`}).join(""):`<div style="font-weight:400;color:var(--mut)">None</div>`;
  const opts=list.filter(m=>m.c!=="fault").map(m=>`<option value="${m.id}">${m.id.toUpperCase()}</option>`).join("");
  if(opts!==lastOpts){const rs=q(".repSel"),cur=rs.value;rs.innerHTML=opts;rs.value=cur;lastOpts=opts;}
  q(".repBtn").disabled=!opts;
  view.innerHTML=`<div class="stats"><span class="chip cav">Available <b>${nAv}</b></span><span class="chip crn">Running <b>${nRun}</b></span><span class="chip cof">Out of order <b>${bad.length}</b></span></div><div class="box"><div class="head"><div>${!all&&kind==="drying"?"Dryer":"Machine"}</div><div>Status | Time</div></div>`+
   (ok.length?ok.map(m=>`<div class="row ${m.c}"><div class="mid">${m.id.toUpperCase()}</div><div class="st ${m.c}"><span class="pill">${m.label}<span class="sw"></span></span>${m.t?`<span class="mins">${m.t} mins</span><div class="prog"><i style="width:${Math.min(100,m.t/60*100)}%"></i></div>`:""}</div></div>`).join(""):`<div class="empty">No machines.</div>`)+`</div>`;
 }

 hostelSel.onchange=()=>{hostel=+hostelSel.value;tab="current";data=[];render();poll();};
 qa("nav button").forEach(b=>b.onclick=()=>{
  if(b.dataset.kind){kind=b.dataset.kind;tab="current";}else tab=b.dataset.tab;render();});
 q(".sort").onchange=render;
 if(q(".nfilter"))q(".nfilter").onchange=render;
 q(".repBtn").onclick=async()=>{
  const id=q(".repSel").value;if(!id)return;
  const note=q(".repNote").value.trim(),h=hostel;
  reports[h+id]={note};
  let msg="Reported "+id.toUpperCase()+" in Hostel "+h+".";
  if(REPORT_URL){try{await fetch(REPORT_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({hostel:h,id,note})});}
   catch(e){msg+=" (Couldn’t reach the server, so it’s saved on this device only.)";}}
  q(".repNote").value="";q(".repMsg").textContent=msg;render();
 };
 async function poll(){
  const h=hostel;
  try{
   const d=await readSensors(h);
